<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gauge Fehleranalyse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Gauge &ndash; KI-gestuetzte Fehleranalyse</h1>
        <p id="summary" class="summary">Lade Report &hellip;</p>
    </header>

    <main>
        <div id="message" class="message" hidden></div>

        <nav id="tabs" class="tabs" hidden></nav>

        <section class="cluster-bar" id="cluster-bar" hidden>
            <button id="cluster-btn" class="secondary-btn">Aehnliche Ursachen finden (KI)</button>
            <span id="cluster-status" class="cluster-status"></span>
        </section>
        <section id="cluster-results" class="cluster-results" hidden></section>

        <section class="analyze-all-bar" id="analyze-all-bar" hidden>
            <button id="analyze-all-btn">Alle Fehler mit KI analysieren</button>
            <span id="analyze-all-status" class="analyze-all-status"></span>
        </section>

        <ul id="failures" class="failures"></ul>
    </main>

    <template id="failure-template">
        <li class="failure">
            <div class="failure-head">
                <span class="badge"></span>
                <span class="badge badge-workspaces" hidden></span>
                <span class="badge badge-cached" hidden>Analyse vorhanden</span>
                <span class="step"></span>
            </div>
            <p class="error"></p>
            <details class="variants" hidden>
                <summary class="variants-summary"></summary>
                <ul class="variants-list"></ul>
            </details>
            <p class="occurrences"></p>
            <div class="actions">
                <button class="analyze-btn">Mit KI analysieren</button>
                <button class="reanalyze-btn secondary-btn" hidden>Neu analysieren</button>
            </div>
            <div class="analysis" hidden>
                <h3>Analyse <span class="analysis-meta"></span></h3>
                <p class="analysis-badges" hidden>
                    <span class="badge analysis-class"></span>
                    <span class="badge analysis-confidence"></span>
                </p>
                <div class="analysis-fields" hidden>
                    <p class="analysis-field"><strong>Wahrscheinliche Ursache:</strong>
                        <span class="analysis-cause"></span></p>
                    <p class="analysis-field"><strong>Massnahme:</strong>
                        <span class="analysis-action"></span></p>
                </div>
                <pre class="analysis-text" hidden></pre>
                <details class="sent">
                    <summary>An die KI gesendet (anonymisiert)</summary>
                    <pre class="sent-text"></pre>
                </details>
                <div class="chat">
                    <h4>Rueckfragen an die KI</h4>
                    <div class="chat-history"></div>
                    <form class="chat-form">
                        <input type="text" class="chat-input"
                               placeholder="Rueckfrage zu diesem Fehler stellen &hellip;"
                               autocomplete="off">
                        <button type="submit" class="chat-send">Senden</button>
                    </form>
                </div>
            </div>
        </li>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
